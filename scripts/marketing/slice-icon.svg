<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="1024" height="1024">
  <!-- Slice's app icon for store listings: the game's board in miniature. A paper
       country on the sage cutting mat, cut by a coral dashed line; the two pieces part,
       and the population rises on the crowded (coral) piece. Drawn from the homepage's
       MiniSlice (app/page.tsx), in the light theme's colours. -->
  <defs>
    <pattern id="grid" width="18.75" height="18.75" patternUnits="userSpaceOnUse">
      <path d="M18.75 0H0V18.75" fill="none" stroke="#fff" stroke-opacity="0.32" stroke-width="0.9" />
    </pattern>
    <clipPath id="upper"><polygon points="-10,1.4 160,95.3 160,-20 -10,-20" /></clipPath>
    <clipPath id="lower"><polygon points="-10,1.4 160,95.3 160,124 -10,124" /></clipPath>
    <path id="country" d="M30 30 C 48 16, 78 22, 98 18 S 128 30, 124 50 S 112 80, 90 86 S 50 92, 36 78 S 18 44, 30 30 Z" />
  </defs>
  <rect width="150" height="150" fill="#bccdbd" />
  <rect width="150" height="150" fill="url(#grid)" />
  <!-- centre the 150x104 drawing (cut line included) in the square -->
  <g transform="translate(75 77) scale(0.92) translate(-78 -52)">
    <!-- the lower piece, nudged away from the cut, with a few people -->
    <g transform="translate(-1.6 2.9)">
      <g clip-path="url(#lower)">
        <use href="#country" transform="translate(0 5)" fill="#e9a68c" />
        <use href="#country" fill="#fffaf3" stroke="#121a2b" stroke-opacity="0.25" stroke-width="0.8" />
      </g>
      <rect x="56" y="58" width="4.4" height="6" rx="0.9" fill="#7b8597" />
      <rect x="72" y="71" width="4.4" height="5" rx="0.9" fill="#7b8597" />
      <rect x="46" y="47" width="4.4" height="5" rx="0.9" fill="#7b8597" />
    </g>
    <!-- the counted piece, tinted, where the crowd is -->
    <g transform="translate(1.6 -2.9)">
      <g clip-path="url(#upper)">
        <use href="#country" transform="translate(0 5)" fill="#e9a68c" />
        <use href="#country" fill="#ffdcd2" stroke="#121a2b" stroke-opacity="0.25" stroke-width="0.8" />
      </g>
      <rect x="98.8" y="15" width="4.4" height="21" rx="0.9" fill="#f2545b" />
      <rect x="106.8" y="26" width="4.4" height="16" rx="0.9" fill="#f2545b" />
      <rect x="90.8" y="20" width="4.4" height="11" rx="0.9" fill="#f2545b" />
      <rect x="112.8" y="40" width="4.4" height="10" rx="0.9" fill="#f2545b" />
      <rect x="97.8" y="39" width="4.4" height="7" rx="0.9" fill="#f2545b" />
      <rect x="84.8" y="33" width="4.4" height="5" rx="0.9" fill="#f2545b" />
    </g>
    <!-- the cut -->
    <path d="M10 12.5 L146 87.5" stroke="#f2545b" stroke-width="2.8" stroke-dasharray="5.5 3.8" stroke-linecap="round" />
  </g>
</svg>
